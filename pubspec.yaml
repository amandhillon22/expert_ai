name: uxpert_ai
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  lottie: ^3.1.2
  google_fonts: ^6.2.1
  flutter_launcher_icons: ^0.14.4
  http: ^1.5.0

flutter_launcher_icons:
  image_path_android: "assets/expert_ai_logo.png"
  image_path_ios: "assets/expert_ai_logo.png"
  android: true
  ios: true
  background_color_ios: "#ffffff"
  background_color_android: "#ffffff"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
